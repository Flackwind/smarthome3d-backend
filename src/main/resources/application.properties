spring.application.name=smart-home-3d-api
server.address=${SH3D_BIND:127.0.0.1}
server.port=${SH3D_PORT:8090}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.servlet.session.timeout=7d
server.servlet.session.persistent=false
server.servlet.session.cookie.name=SH3D_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SH3D_COOKIE_SECURE:false}
server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.path=/api
server.tomcat.max-http-form-post-size=160MB
server.tomcat.max-swallow-size=160MB
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=160MB
spring.datasource.url=${SH3D_DATABASE_URL:jdbc:h2:file:./data/smarthome;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SH3D_DATABASE_USER:sa}
spring.datasource.password=${SH3D_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-trailing-tokens=true
sh3d.origins=${SH3D_ORIGINS:http://localhost:4300,http://127.0.0.1:4300,http://localhost:4200,http://127.0.0.1:4200}
sh3d.ha-url=${SH3D_HA_URL:}
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
